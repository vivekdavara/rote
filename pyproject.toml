[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "rote"
version = "0.1.0"
description = "Record a legacy-app workflow once with an LLM, then replay it deterministically as a typed, reviewable capability."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "playwright==1.58.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "typer>=0.12",
    "rich>=13.7",
    "anthropic>=0.40",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
]

[project.scripts]
rote = "rote.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/rote", "mockapp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = ["integration: drives a real browser against the mock app"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["evidence", "runs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["rote.schema.*", "rote.replay.*"]
strict = true
