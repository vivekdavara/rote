name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          pip install -e ".[dev,mcp]"
          playwright install --with-deps chromium
      - name: Lint
        run: ruff check src mockapp tests spikes
      - name: Type-check schema and replay engine
        run: mypy src/rote/schema src/rote/replay
      - name: Test (no API key; replay, mock app, cassette-driven discovery)
        run: pytest -q
