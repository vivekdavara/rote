# Goal spec for an irreversible capability. Discovery needs an operator to approve the
# Confirm click (run with --attended); replay never commits without a preview token.
capability_id: coreone.member.open_sub_account
summary: Open a new share sub-account for a member, funded from one of their accounts.
goal: >-
  Open a new {share_type} sub-account nicknamed "{nickname}" for member {member_id}, with an initial
  deposit of {deposit} dollars funded from the member's account {funding_suffix}. The Truth-in-Savings
  disclosure has been provided to the member. On the review screen, read the share type, the initial
  deposit and the funding account. Then confirm, and read the confirmation number.
tenant: harbor
product: coreone
product_versions: ">=4.2,<5"

inputs:
  member_id:
    pattern: "^[0-9]{6}$"
    sensitive: member_id
    description: Six-digit member number.
    examples: ["100234", "100517"]
  share_type:
    enum: [Regular Savings, Holiday Club, Money Market]
    examples: ["Holiday Club", "Regular Savings"]
  nickname:
    pattern: "^[A-Za-z0-9 ]{1,20}$"
    examples: ["Holiday 2026", "Rainy Day"]
  deposit:
    type: decimal
    description: Initial deposit in dollars.
    examples: ["25.00", "10.00"]
  funding_suffix:
    pattern: "^S[0-9]{2}$"
    description: Suffix of the member's account that funds the deposit.
    examples: ["S00", "S10"]

outputs:
  review_share_type: {type: string, description: Share type as shown on the review screen.}
  review_deposit: {type: money, description: Initial deposit as shown on the review screen.}
  review_funding_account: {type: string, description: Funding account as shown on the review screen.}
  confirmation_number: {type: string, description: CoreOne's confirmation number for the new sub-account.}

negative_examples:
  - code: VALIDATION_REJECTED
    description: CoreOne rejected the request; the app's message says why.
    inputs: {member_id: "100234", share_type: Holiday Club, nickname: Too Small, deposit: "1.00", funding_suffix: S00}
  - code: VALIDATION_REJECTED
    inputs: {member_id: "100234", share_type: Holiday Club, nickname: Too Large, deposit: "9000.00", funding_suffix: S00}
